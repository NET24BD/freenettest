<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLogin - Customer Portal</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* মুভি থিয়েটারের মতো ডার্ক রেড এবং ব্ল্যাক সিনেমাটিক ব্যাকগ্রাউন্ড */
            background: linear-gradient(-45deg, #09090b, #180808, #2d0606, #09090b);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* লাইভ সিনেমাটিক গ্লো পার্টিকেল */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* মুভি টিকিট স্টাইল গ্লাস কন্টেইনার */
        .login-container {
            background: rgba(15, 11, 11, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(229, 9, 20, 0.2); /* Netflix এর মতো রেড বর্ডার গ্লো */
            padding: 40px 35px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 40px rgba(229, 9, 20, 0.15), 0 25px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* মুভি লোগো ও হেডার */
        .movie-logo {
            font-size: 42px;
            color: #e50914; /* সিনেমাটিক রেড */
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
            animation: popIcon 1.5s ease-in-out infinite alternate;
        }

        @keyframes popIcon {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .login-header h2 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .login-header p {
            color: #a1a1aa;
            font-size: 13px;
            margin-bottom: 35px;
        }

        /* মুভি স্টাইল ইনপুট ফিল্ড */
        .input-group {
            position: relative;
            margin-bottom: 22px;
            text-align: left;
        }

        .input-group i.left-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #71717a;
            font-size: 16px;
            transition: 0.3s;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 16px 45px 16px 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        /* সিনেমাটিক রেড ফোকাস ইফেক্ট */
        .input-group input:focus {
            border-color: #e50914;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.3);
        }

        .input-group input:focus ~ i.left-icon {
            color: #e50914;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #71717a;
            cursor: pointer;
            transition: 0.3s;
        }
        .toggle-password:hover {
            color: #e50914;
        }

        .forgot-pass {
            text-align: right;
            margin-bottom: 30px;
        }

        .forgot-pass a {
            color: #a1a1aa;
            font-size: 13px;
            text-decoration: none;
            transition: 0.3s;
        }

        .forgot-pass a:hover {
            color: #e50914;
            text-decoration: underline;
        }

        /* প্রিমিয়াম মুভি টিকিট/বাটন ডিজাইন */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(229, 9, 20, 0.6);
            letter-spacing: 0.5px;
        }

        /* লাইভ লোডিং স্পিনার */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- গোল্ডেন/রেড থিয়েটার লাইট কণার জন্য ক্যানভাস -->
    <div id="particles-js"></div>

    <div class="login-container">
        <!-- সিনেমার পপকর্ন/রিল বা টিকিট আইকন -->
        <div class="movie-logo">
            <i class="fas fa-film"></i>
        </div>
        
        <div class="login-header">
            <h2>শো-টাইম ড্যাশবোর্ড</h2>
            <p>আপনার কাস্টমার অ্যাকাউন্টে সাইন-ইন করুন</p>
        </div>

        <form id="loginForm">
            <!-- ইউজারনেম (টিকিট আইকনসহ) -->
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="ইউজারনেম বা ইমেইল" required autocomplete="off">
                <i class="fas fa-ticket-alt left-icon"></i>
            </div>

            <!-- পাসওয়ার্ড (লক এবং আই আইকনসহ) -->
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="পাসওয়ার্ড" required>
                <i class="fas fa-lock left-icon"></i>
                <i class="fas fa-eye toggle-password" id="eyeIcon"></i>
            </div>

            <div class="forgot-pass">
                <a href="#">পাসওয়ার্ড ভুলে গেছেন?</a>
            </div>

            <!-- বাটন (পপকর্ন বা প্লে আইকনসহ করা যাবে) -->
            <button type="submit" class="login-btn" id="submitBtn">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText"><i class="fas fa-play" style="font-size: 12px; margin-right: 5px;"></i> এন্টার পোর্টাল</span>
            </button>
        </form>
    </div>

    <!-- লাইভ পার্টিক্যালের জন্য স্ক্রিপ্ট -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        /* গোল্ডেন থিয়েটার লাইটের মতো পার্টিকেল ইফেক্ট */
        particlesJS('particles-js', {
            particles: {
                number: { value: 50, density: { enable: true, value_area: 800 } },
                color: { value: '#e50914' }, /* রেড এবং গোল্ড মিক্স কণা */
                shape: { type: 'circle' },
                opacity: { value: 0.4, random: true },
                size: { value: 4, random: true },
                line_linked: { enable: false }, /* সিনেমাটিক ভাইবের জন্য লাইন অফ করা হয়েছে */
                move: { enable: true, speed: 1.5, direction: 'top', random: true, straight: false, out_mode: 'out' }
            }
        });

        /* পাসওয়ার্ড শো/হাইড লজিক */
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        eyeIcon.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });

        /* লাইভ বাটন লোডিং লজিক */
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const submitBtn = document.getElementById('submitBtn');

            btnText.innerText = "টিকিট ভেরিফাই হচ্ছে...";
            btnSpinner.style.display = "block";
            submitBtn.style.pointerEvents = "none";
        });
    </script>
</body>
</html>
