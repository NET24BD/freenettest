<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#07140f; /* NEW THEME BACKGROUND */
    color:#eafff3;
}

header{
    text-align:center;
    padding:15px;
    font-size:22px;
    font-weight:bold;
    background:linear-gradient(90deg,#00c853,#ff1744);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* TOP BAR */
.topbar{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:10px;
    flex-wrap:wrap;
}

.box{
    background:#0e241b; /* THEME DARK GREEN */
    padding:8px 12px;
    border-radius:10px;
    font-size:13px;
    border:1px solid rgba(0,200,83,0.25);
    color:#eafff3;
}

/* LOGOUT */
.logout{
    background:#ff1744;
    color:white;
    border:none;
    padding:8px 12px;
    cursor:pointer;
    border-radius:10px;
}

/* CONTAINER */
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
    gap:18px;
    padding:20px;
}

/* CARD */
.card{
    background:#0e241b; /* NEW DARK GREEN CARD */
    padding:20px;
    border-radius:15px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
    border:1px solid rgba(0,200,83,0.15);
}

.card:hover{
    transform:scale(1.05);
    background:#123225;
    border-color:#00c853;
    box-shadow:0 0 15px rgba(0,200,83,0.25);
}

/* STATUS */
.status{
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
}

.online{
    color:#00e676;
}

.offline{
    color:#ff5252;
}

.server-name{
    font-size:16px;
    font-weight:600;
    display:block;
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid rgba(255,255,255,0.08);
}
</style>
</head>

<body>

<header>⚡ Customer Dashboard</header>

<div class="topbar">
    <div class="box">🟢 Active: <span id="active">0</span></div>
    <div class="box">📡 Total: <span id="total">0</span></div>
    <div class="box">⏰ <span id="time"></span></div>
    <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card" data-link="http://172.20.21.22/">
    <div class="status online">ONLINE</div>
    <span class="server-name">Fun time</span>
</div>

<div class="card" data-link="http://new.circleftp.net/">
    <div class="status online">ONLINE</div>
    <span class="server-name">Circelftp</span>
</div>

<div class="card" data-link="https://ctgmovies.com/">
    <div class="status online">ONLINE</div>
    <span class="server-name">Ctg Movie</span>
</div>

<div class="card" data-link="http://play.starplex.live/">
    <div class="status online">ONLINE</div>
    <span class="server-name">Star Plex</span>
</div>

<div class="card" data-link="https://netflix.com">
    <div class="status online">ONLINE</div>
    <span class="server-name">Netflix</span>
</div>

</div>

<script>

// LOGIN CHECK
if(localStorage.getItem("auth") !== "true"){
    window.location.replace("customer-login.html");
}

// LOGOUT
function logout(){
    localStorage.removeItem("auth");
    window.location.replace("customer-login.html");
}

// CARD CLICK
document.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click",()=>{
        window.open(card.getAttribute("data-link"), "_blank");
    });
});

// COUNT
function update(){
    let cards = document.querySelectorAll(".card");
    let online = document.querySelectorAll(".online");

    document.getElementById("active").innerText = online.length;
    document.getElementById("total").innerText = cards.length;
}
update();

// TIME
setInterval(()=>{
    document.getElementById("time").innerText = new Date().toLocaleTimeString();
},1000);

</script>

</body>
</html>
