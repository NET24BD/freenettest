<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

header{
    text-align:center;
    padding:15px;
    font-size:22px;
}

.topbar{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:10px;
    flex-wrap:wrap;
}

.box{
    background:#1e293b;
    padding:8px 12px;
    border-radius:10px;
    font-size:13px;
}

.logout{
    background:red;
    color:white;
    border:none;
    padding:8px 12px;
    cursor:pointer;
    border-radius:10px;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
}
.status{
    color:#22c55e;
    font-size:12px;
}
</style>
</head>

<body>

<header>⚡ Customer Dashboard</header>

<div class="topbar">
    <div class="box">🟢 Active: <span id="active"></span></div>
    <div class="box">📡 Total: <span id="total"></span></div>
    <div class="box">⏰ <span id="time"></span></div>
    <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card"><div class="status">ONLINE</div>Server 01</div>
<div class="card"><div class="status">ONLINE</div>Server 02</div>
<div class="card"><div class="status">ONLINE</div>Server 03</div>
<div class="card"><div class="status">ONLINE</div>Server 04</div>
<div class="card"><div class="status">ONLINE</div>Server 05</div>

</div>

<script>

////////////////////////////////////////////////////
// 🔐 PROTECTION (LOGIN REQUIRED)
////////////////////////////////////////////////////
if(localStorage.getItem("auth") !== "true"){
    window.location.replace("customer-login.html");
}

////////////////////////////////////////////////////
// 🚫 BACK BUTTON BLOCK
////////////////////////////////////////////////////
window.history.pushState(null, "", window.location.href);
window.onpopstate = function(){
    window.history.pushState(null, "", window.location.href);
};

////////////////////////////////////////////////////
// 🚪 LOGOUT
////////////////////////////////////////////////////
function logout(){
    localStorage.removeItem("auth");
    window.location.replace("customer-login.html");
}

////////////////////////////////////////////////////
// 📊 COUNT
////////////////////////////////////////////////////
let cards = document.querySelectorAll(".card");
document.getElementById("active").innerText = cards.length;
document.getElementById("total").innerText = cards.length;

////////////////////////////////////////////////////
// ⏰ TIME
////////////////////////////////////////////////////
setInterval(()=>{
    document.getElementById("time").innerText = new Date().toLocaleTimeString();
},1000);

</script>

</body>
</html>
